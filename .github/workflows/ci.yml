name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      timescaledb:
        image: timescale/timescaledb:2.25.0-pg17
        env:
          POSTGRES_USER: infoclimat
          POSTGRES_PASSWORD: infoclimat2026
          POSTGRES_DB: meteodb
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U infoclimat -d meteodb" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Tests
        working-directory: backend
        run: |
          cp .env.example .env
          uv run pytest --junitxml=test-report.xml --tb=short
        env:
          DB_HOST: localhost
      - name: Lint
        working-directory: backend
        run: uv run ruff check . --output-format=json > ruff-report.json || true
      - name: Security scan
        working-directory: backend
        run: |
          uv pip install bandit
          uv run bandit -r weather config -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/test-report.xml
            backend/ruff-report.json
            backend/bandit-report.json

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx vitest run --project unit
        working-directory: frontend

  build:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t devops-backend:latest ./backend
          docker build -t devops-frontend:latest ./frontend
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-backend:latest
          format: json
          output: trivy-backend-report.json
          severity: CRITICAL,HIGH,MEDIUM
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-frontend:latest
          format: json
          output: trivy-frontend-report.json
          severity: CRITICAL,HIGH,MEDIUM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-backend-report.json
            trivy-frontend-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: vex-file
          path: .github/vex.json
      - name: Push to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag devops-backend:latest ghcr.io/${REPO_LC}/backend:latest
          docker push ghcr.io/${REPO_LC}/backend:latest
          docker tag devops-frontend:latest ghcr.io/${REPO_LC}/frontend:latest
          docker push ghcr.io/${REPO_LC}/frontend:latest
